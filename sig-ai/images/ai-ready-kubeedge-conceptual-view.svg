<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Conceptual View of AI-Ready KubeEdge</title>
  <desc>A stable conceptual architecture diagram for discussing AI-ready KubeEdge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#256f95"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #173b57; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #66788a; }
      .section { font-size: 22px; font-weight: 700; fill: #0d6688; }
      .box { font-size: 17px; font-weight: 700; fill: #173b57; }
      .body { font-size: 14px; fill: #536879; }
      .small { font-size: 13px; fill: #536879; }
      .tiny { font-size: 12px; fill: #637487; }
      .white-title { fill: #ffffff; font-size: 28px; font-weight: 700; }
      .num { fill: #ffffff; font-size: 15px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7fbff"/>
  <text x="800" y="50" text-anchor="middle" class="title">Conceptual View of AI-Ready KubeEdge</text>
  <text x="800" y="80" text-anchor="middle" class="subtitle">Discussion scope, not final architecture</text>

  <!-- Cloud side -->
  <rect x="70" y="110" width="1080" height="130" rx="18" fill="#eef7ff" stroke="#bdd6ef" stroke-width="2"/>
  <text x="105" y="146" class="section">Cloud Side</text>

  <rect x="260" y="135" width="255" height="78" rx="14" fill="#ffffff" stroke="#c7dcf1" stroke-width="2"/>
  <text x="388" y="165" text-anchor="middle" class="box">AI Workload &amp; Policy</text>
  <text x="388" y="190" text-anchor="middle" class="body">desired state, rollout policy</text>

  <rect x="555" y="135" width="255" height="78" rx="14" fill="#ffffff" stroke="#c7dcf1" stroke-width="2"/>
  <text x="683" y="165" text-anchor="middle" class="box">Observability &amp; Operations</text>
  <text x="683" y="190" text-anchor="middle" class="body">metrics, events, audit</text>

  <rect x="850" y="135" width="255" height="78" rx="14" fill="#ffffff" stroke="#c7dcf1" stroke-width="2"/>
  <text x="978" y="160" text-anchor="middle" class="box">Ecosystem Integrations</text>
  <text x="978" y="185" text-anchor="middle" class="body">Sedna · Ianvs · Dashboard</text>
  <text x="978" y="204" text-anchor="middle" class="body">User Platforms</text>

  <!-- Right discussion panel -->
  <rect x="1200" y="110" width="330" height="680" rx="18" fill="#ffffff" stroke="#c7dcf1" stroke-width="2"/>
  <text x="1230" y="150" class="section">Key Discussion Areas</text>

  <circle cx="1245" cy="195" r="16" fill="#1e7da3"/><text x="1245" y="201" class="num">1</text>
  <text x="1280" y="190" class="box">Edge AI Node</text>
  <text x="1280" y="213" class="box">Capability Modeling</text>
  <line x1="1230" y1="240" x2="1500" y2="240" stroke="#d8e5f0" stroke-width="1.5" stroke-dasharray="5 6"/>

  <circle cx="1245" cy="278" r="16" fill="#1e7da3"/><text x="1245" y="284" class="num">2</text>
  <text x="1280" y="273" class="box">Edge-Native AI</text>
  <text x="1280" y="296" class="box">Workload Orchestration</text>
  <line x1="1230" y1="323" x2="1500" y2="323" stroke="#d8e5f0" stroke-width="1.5" stroke-dasharray="5 6"/>

  <circle cx="1245" cy="361" r="16" fill="#1e7da3"/><text x="1245" y="367" class="num">3</text>
  <text x="1280" y="356" class="box">Cloud-Edge-Device</text>
  <text x="1280" y="379" class="box">Collaborative Inference</text>
  <line x1="1230" y1="406" x2="1500" y2="406" stroke="#d8e5f0" stroke-width="1.5" stroke-dasharray="5 6"/>

  <circle cx="1245" cy="444" r="16" fill="#1e7da3"/><text x="1245" y="450" class="num">4</text>
  <text x="1280" y="439" class="box">Edge AI Observability</text>
  <text x="1280" y="462" class="box">and Validation</text>
  <line x1="1230" y1="489" x2="1500" y2="489" stroke="#d8e5f0" stroke-width="1.5" stroke-dasharray="5 6"/>

  <circle cx="1245" cy="527" r="16" fill="#1e7da3"/><text x="1245" y="533" class="num">5</text>
  <text x="1280" y="522" class="box">Production-Grade Edge</text>
  <text x="1280" y="545" class="box">Security and Autonomy</text>

  <line x1="1230" y1="655" x2="1290" y2="655" stroke="#256f95" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1310" y="660" class="tiny">Control / desired state</text>
  <line x1="1230" y1="700" x2="1290" y2="700" stroke="#256f95" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="1310" y="705" class="tiny">Feedback / status sync</text>

  <!-- Cloud to control arrows -->
  <line x1="465" y1="252" x2="465" y2="292" stroke="#256f95" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="274" class="tiny">Desired state, policies, workloads, configs</text>
  <line x1="960" y1="292" x2="960" y2="252" stroke="#256f95" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="825" y="274" class="tiny">Status, metrics, events, audit</text>

  <!-- Control plane -->
  <rect x="140" y="300" width="1010" height="112" rx="22" fill="#0f7190"/>
  <text x="645" y="342" text-anchor="middle" class="white-title">KubeEdge Cloud-Edge Control Plane</text>
  <rect x="240" y="360" width="180" height="34" rx="17" fill="#ffffff"/>
  <text x="330" y="382" text-anchor="middle" class="box">Delivery &amp; Sync</text>
  <rect x="455" y="360" width="190" height="34" rx="17" fill="#ffffff"/>
  <text x="550" y="382" text-anchor="middle" class="box">Lifecycle Mgmt</text>
  <rect x="680" y="360" width="185" height="34" rx="17" fill="#ffffff"/>
  <text x="773" y="382" text-anchor="middle" class="box">Metadata &amp; Status</text>
  <rect x="900" y="360" width="170" height="34" rx="17" fill="#ffffff"/>
  <text x="985" y="382" text-anchor="middle" class="box">Edge Autonomy</text>

  <!-- Control to edge arrows -->
  <line x1="465" y1="424" x2="465" y2="462" stroke="#256f95" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="445" class="tiny">Workload delivery, updates, policies</text>
  <line x1="960" y1="462" x2="960" y2="424" stroke="#256f95" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="790" y="445" class="tiny">Node status, metrics, health, recovery sync</text>

  <!-- Edge nodes -->
  <rect x="70" y="470" width="1080" height="188" rx="18" fill="#f0fbfb" stroke="#b9e2e0" stroke-width="2"/>
  <text x="105" y="508" class="section">Edge AI Nodes</text>

  <rect x="290" y="495" width="180" height="70" rx="14" fill="#ffffff" stroke="#c2e2df" stroke-width="2"/>
  <text x="380" y="525" text-anchor="middle" class="box">AI PC</text>
  <text x="380" y="550" text-anchor="middle" class="body">NPU / CPU</text>

  <rect x="500" y="495" width="180" height="70" rx="14" fill="#ffffff" stroke="#c2e2df" stroke-width="2"/>
  <text x="590" y="525" text-anchor="middle" class="box">Edge Server</text>
  <text x="590" y="550" text-anchor="middle" class="body">GPU / CPU</text>

  <rect x="710" y="495" width="180" height="70" rx="14" fill="#ffffff" stroke="#c2e2df" stroke-width="2"/>
  <text x="800" y="525" text-anchor="middle" class="box">ARM Device</text>
  <text x="800" y="550" text-anchor="middle" class="body">Lightweight Runtime</text>

  <rect x="920" y="495" width="200" height="70" rx="14" fill="#ffffff" stroke="#c2e2df" stroke-width="2"/>
  <text x="1020" y="525" text-anchor="middle" class="box">Gateway / Robot / Camera</text>
  <text x="1020" y="550" text-anchor="middle" class="body">Local Processing</text>

  <rect x="290" y="590" width="830" height="48" rx="14" fill="#def4f2" stroke="#9bd0cc" stroke-width="1.5"/>
  <text x="705" y="612" text-anchor="middle" class="box">Edge AI Node Capability Modeling</text>
  <text x="705" y="633" text-anchor="middle" class="small">accelerator · runtime · model cache · network · resource · security · business state</text>

  <!-- Edge to workloads arrows -->
  <line x1="465" y1="670" x2="465" y2="705" stroke="#256f95" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="960" y1="705" x2="960" y2="670" stroke="#256f95" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="770" y="689" class="tiny">Workload health, metrics, logs, recovery status</text>

  <!-- Local workloads -->
  <rect x="70" y="710" width="1080" height="100" rx="18" fill="#ffffff" stroke="#c9ddf3" stroke-width="2"/>
  <text x="105" y="748" class="section">Local AI Workloads</text>
  <text x="105" y="776" class="small">Local inference services running on selected edge nodes</text>
  <rect x="455" y="735" width="90" height="42" rx="12" fill="#eef7ff" stroke="#c7dcf1" stroke-width="2"/>
  <text x="500" y="762" text-anchor="middle" class="box">LLM</text>
  <rect x="575" y="735" width="90" height="42" rx="12" fill="#eef7ff" stroke="#c7dcf1" stroke-width="2"/>
  <text x="620" y="762" text-anchor="middle" class="box">VLM</text>
  <rect x="695" y="735" width="90" height="42" rx="12" fill="#eef7ff" stroke="#c7dcf1" stroke-width="2"/>
  <text x="740" y="762" text-anchor="middle" class="box">ASR</text>
  <rect x="815" y="735" width="90" height="42" rx="12" fill="#eef7ff" stroke="#c7dcf1" stroke-width="2"/>
  <text x="860" y="762" text-anchor="middle" class="box">OCR</text>
  <rect x="935" y="735" width="180" height="42" rx="12" fill="#eef7ff" stroke="#c7dcf1" stroke-width="2"/>
  <text x="1025" y="762" text-anchor="middle" class="box">CV / Anomaly</text>

  <!-- Boundary note -->
  <rect x="70" y="830" width="1080" height="52" rx="14" fill="#fffdf5" stroke="#efc96e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="105" y="852" class="box">KubeEdge focuses on control plane, lifecycle, status, and autonomy.</text>
  <text x="105" y="872" class="body">Large model artifacts and high-volume data use dedicated data paths.</text>
</svg>
